<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Teste VLibras</title>
</head>

<body>

    <h1>Teste do VLibras</h1>

    <p>
        Esta é uma página simples para testar
        o carregamento do tradutor de Libras.
    </p>


    <!-- ==========================================
         VLIBRAS OFICIAL
    ========================================== -->

    <div vw class="enabled">

        <div
            vw-access-button
            class="active">
        </div>

        <div vw-plugin-wrapper>

            <div
                class="vw-plugin-top-wrapper">
            </div>

        </div>

    </div>


    <script
        src="https://vlibras.gov.br/app/vlibras-plugin.js">
    </script>


    <script>

        new window.VLibras.Widget(
            'https://vlibras.gov.br/app'
        );

    </script>

</body>

</html>
